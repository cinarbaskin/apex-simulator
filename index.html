<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plane Simulator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a2e; color: white; text-align: center; margin: 0; padding: 20px; }
        .header { background: #16213e; padding: 15px; border-radius: 10px; display: flex; justify-content: space-around; font-size: 1.2em; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; justify-content: center; max-width: 400px; margin: 20px auto; background: #0f3460; padding: 15px; border-radius: 10px; }
        .slot { width: 80px; height: 80px; background: #1a1a2e; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .slot.selected { border-color: #e94560; transform: scale(1.05); }
        .ucak { width: 100%; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-shadow: 1px 1px 2px black; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .market, .kasalar { background: #16213e; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .kasa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        button { background: #e94560; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d03050; }
    </style>
</head>
<body>
    <!-- Kullanıcı Giriş Sistemi Korundu -->
    <div id="login-screen" style="display:none;">
        <h2>Giriş Yap</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <button onclick="document.getElementById('login-screen').style.display='none'; document.getElementById('game-screen').style.display='block';">Giriş</button>
    </div>

    <div id="game-screen">
        <div class="header">
            <div>Para: <span id="para">1000</span>$</div>
            <div>Maks Lvl: <span id="max-level">3</span></div>
            <div>Gelir/sn: <span id="gelir">0</span>$</div>
        </div>

        <div class="market">
            <button id="market-btn" onclick="markettenUcakAl()">Seviye 1 Uçak Al (Fiyat: 80$)</button>
        </div>

        <h3>Pist (Birleştirmek için önce bir uçağa, sonra diğerine tıkla)</h3>
        <div class="grid-container" id="grid"></div>

        <div class="kasalar">
            <h3>🎁 Özel Kasalar</h3>
            <div class="kasa-grid" id="kasa-alani"></div>
        </div>
    </div>

    <script>
        // Oyun Değişkenleri ve 12 Slotluk Izgara
        let para = 1000;
        let maxLevel = 3;
        let grid = [1, 2, 3, null, null, null, null, null, null, null, null, null]; 
        let seciliIndex = null;

        // 20 Kademeli Dev Kasa Sistemi
        const kasaIsimleri = [
            "Tahta Kasa", "Paslı Kasa", "Demir Kasa", "Çelik Kasa", "Bronz Kasa", 
            "Gümüş Kasa", "Altın Kasa", "Platin Kasa", "Titanyum Kasa", "Kristal Kasa", 
            "Zümrüt Kasa", "Yakut Kasa", "Safir Kasa", "Elmas Kasa", "Obsidyen Kasa", 
            "Ejderha Kasası", "Meteor Kasası", "Galaksi Kasası", "Hiçlik (Void) Kasası", "Tanrısal Kasa"
        ];
        
        const kasalar = kasaIsimleri.map((isim, i) => {
            let carpan = Math.pow(2.2, i);
            let minLvl = i === 19 ? 190 : (i * 9) + 1;
            let maxLvl = i === 19 ? 200 : (i * 9) + 10;
            if(i === 0) { minLvl = 1; maxLvl = 3; }
            if(i === 1) { minLvl = 3; maxLvl = 6; }
            return { id: i + 1, isim, fiyat: Math.floor(500 * carpan), minLvl, maxLvl };
        });

        // 200 Eşsiz Uçak İçin Algoritmik Renk Üretimi
        function ucakRengi(level) {
            let hue = (level * 45) % 360;
            let lightness = 40 + (level % 20); 
            return `hsl(${hue}, 80%, ${lightness}%)`;
        }

        // Izgarayı ve Ekranı Güncelleme
        function cizGrid() {
            const gridDiv = document.getElementById("grid");
            gridDiv.innerHTML = "";
            let toplamGelir = 0;

            grid.forEach((ucak, index) => {
                let slotDiv = document.createElement("div");
                slotDiv.className = "slot" + (seciliIndex === index ? " selected" : "");
                
                if (ucak !== null) {
                    let ucakDiv = document.createElement("div");
                    ucakDiv.className = "ucak";
                    ucakDiv.style.background = ucakRengi(ucak);
                    ucakDiv.innerText = "Lv." + ucak;
                    slotDiv.appendChild(ucakDiv);
                    
                    // Ekonomik Denge: Uçakların Saniyelik Getirisi
                    toplamGelir += Math.floor(10 * Math.pow(1.15, ucak));
                }

                slotDiv.onclick = () => slotTikla(index);
                gridDiv.appendChild(slotDiv);
            });

            document.getElementById("para").innerText = Math.floor(para).toLocaleString('tr-TR');
            document.getElementById("max-level").innerText = maxLevel;
            document.getElementById("gelir").innerText = toplamGelir.toLocaleString('tr-TR');
            
            // Dinamik Market: Her Zaman Max Level - 2
            let alinacakLevel = Math.max(1, maxLevel - 2);
            let fiyat = Math.floor(50 * Math.pow(1.6, alinacakLevel));
            document.getElementById("market-btn").innerText = `Seviye ${alinacakLevel} Uçak Al (${fiyat.toLocaleString('tr-TR')}$)`;
        }

        // Merge (Birleştirme) Mekaniği
        function slotTikla(index) {
            if (seciliIndex === null) {
                if (grid[index] !== null) seciliIndex = index;
            } else {
                if (seciliIndex === index) {
                    seciliIndex = null; 
                } else if (grid[index] === null) {
                    grid[index] = grid[seciliIndex];
                    grid[seciliIndex] = null;
                    seciliIndex = null;
                } else if (grid[index] === grid[seciliIndex]) {
                    let yeniLevel = grid[index] + 1;
                    grid[index] = yeniLevel;
                    grid[seciliIndex] = null;
                    if (yeniLevel > maxLevel) maxLevel = yeniLevel;
                    seciliIndex = null;
                } else {
                    seciliIndex = index; 
                }
            }
            cizGrid();
        }

        function markettenUcakAl() {
            let alinacakLevel = Math.max(1, maxLevel - 2);
            let fiyat = Math.floor(50 * Math.pow(1.6, alinacakLevel));
            if (para >= fiyat) {
                let bosSlot = grid.indexOf(null);
                if (bosSlot !== -1) {
                    para -= fiyat;
                    grid[bosSlot] = alinacakLevel;
                    cizGrid();
                } else alert("Pistte yer yok, uçakları birleştir!");
            }
        }

        function kasaAc(kasa) {
            if (para >= kasa.fiyat) {
                let bosSlot = grid.indexOf(null);
                if (bosSlot !== -1) {
                    para -= kasa.fiyat;
                    let cikanLevel = Math.floor(Math.random() * (kasa.maxLvl - kasa.minLvl + 1)) + kasa.minLvl;
                    grid[bosSlot] = cikanLevel;
                    if (cikanLevel > maxLevel) maxLevel = cikanLevel;
                    cizGrid();
                } else alert("Pistte yer yok! Önce uçakları birleştir.");
            } else alert("Paran yetersiz!");
        }

        function baslat() {
            let kasaAlani = document.getElementById("kasa-alani");
            kasalar.forEach(kasa => {
                let btn = document.createElement("button");
                if (kasa.id === 20) btn.style.background = "linear-gradient(45deg, gold, red)";
                if (kasa.id === 19) btn.style.background = "linear-gradient(45deg, purple, black)";
                btn.innerText = `${kasa.isim}\n(Lv.${kasa.minLvl}-${kasa.maxLvl})\n${kasa.fiyat.toLocaleString('tr-TR')}$`;
                btn.onclick = () => kasaAc(kasa);
                kasaAlani.appendChild(btn);
            });

            // Pasif Gelir Döngüsü (Saniyede 1 Kere)
            setInterval(() => {
                let gelir = 0;
                grid.forEach(u => { if (u !== null) gelir += Math.floor(10 * Math.pow(1.15, u)); });
                para += gelir;
                cizGrid();
            }, 1000);

            cizGrid();
        }

        baslat();
    </script>
</body>
</html>
